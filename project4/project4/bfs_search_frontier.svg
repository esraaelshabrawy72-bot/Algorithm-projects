<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="auto" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<text x="40" y="32" font-size="18" font-weight="700" fill="#0f172a">Search Space Complexity: Unidirectional vs. Bidirectional BFS</text>
<text x="40" y="52" font-size="12.5" fill="#64748b">Mathematical reason for exponential speedup: Expanding radius d (O(b^d)) vs two radii d/2 (O(2 · b^(d/2)))</text>
<text x="220" y="95" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Unidirectional BFS</text>
<text x="220" y="115" font-size="11.5" fill="#dc2626" text-anchor="middle">States Explored: O(bᵈ) [Full Sphere]</text>
<circle cx="220" cy="230" r="30" fill="#fee2e2" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="220" cy="230" r="60" fill="#fee2e2" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="220" cy="230" r="95" fill="#fee2e2" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="220" cy="230" r="130" fill="#fee2e2" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="220" cy="230" r="130" fill="#ef4444" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
<circle cx="220" cy="230" r="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="220" y="234" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">START</text>
<circle cx="340" cy="230" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
<text x="340" y="234" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">GOAL</text>
<line x1="232" y1="230" x2="330" y2="230" stroke="#dc2626" stroke-width="2"/>
<text x="280" y="222" font-size="11" font-weight="600" fill="#b91c1c">Radius d</text>
<text x="640.0" y="95" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Bidirectional BFS (Optimized)</text>
<text x="640.0" y="115" font-size="11.5" fill="#16a34a" text-anchor="middle">States Explored: O(2 · b^(d/2)) [Intersecting Spheres]</text>
<circle cx="540" cy="230" r="35" fill="#dcfce7" fill-opacity="0.5" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="540" cy="230" r="75" fill="#22c55e" fill-opacity="0.18" stroke="#16a34a" stroke-width="2"/>
<circle cx="740" cy="230" r="35" fill="#dbeafe" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="740" cy="230" r="75" fill="#3b82f6" fill-opacity="0.18" stroke="#2563eb" stroke-width="2"/>
<circle cx="640.0" cy="230" r="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
<text x="640.0" y="218" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle">MEETING NODE</text>
<circle cx="540" cy="230" r="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="540" y="234" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">START</text>
<circle cx="740" cy="230" r="12" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
<text x="740" y="234" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">GOAL</text>
<text x="575" y="222" font-size="10" font-weight="600" fill="#15803d">d/2</text>
<text x="695" y="222" font-size="10" font-weight="600" fill="#1e40af">d/2</text>
<rect x="40" y="380" width="780" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="55" y="402" font-size="11.5" font-weight="700" fill="#0f172a">Key Insight:</text>
<text x="135" y="402" font-size="11.5" fill="#334155">If average branching factor b = 10 and depth d = 6:</text>
<text x="55" y="422" font-size="11.5" fill="#b91c1c">Unidirectional BFS explores: 10⁶ = 1,000,000 nodes</text>
<text x="420" y="422" font-size="11.5" font-weight="600" fill="#15803d">Bidirectional BFS explores: 2 × 10³ = 2,000 nodes (500× reduction!)</text>
</svg>